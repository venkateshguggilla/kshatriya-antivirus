name: release

# Builds a release zip for a version tag (or on demand) and uploads it as a workflow artifact; nothing is
# published automatically.
#
# Signing (ADR 0014): when the repository variable SIGNPATH_ORGANIZATION_ID and the secret
# SIGNPATH_API_TOKEN exist, the unsigned build is submitted to SignPath (SignPath Foundation certificate
# for open-source projects). Each request waits for manual approval by a project approver in SignPath, then
# the signed binaries replace the unsigned ones and the package step refuses to continue unless every
# Kshatriya binary is validly signed. Without that configuration the release is built and marked UNSIGNED.
# No certificate or private key exists in this repository or on the runner.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read # SignPath reads job details and downloads the unsigned artifact with the job token

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SIGNPATH_CONFIGURED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch YARA-X (hash-pinned)
        shell: pwsh
        run: ./scripts/Get-YaraX.ps1

      - name: Build and test (warnings are errors)
        run: |
          dotnet build Kshatriya.slnx -c Release
          dotnet test Kshatriya.slnx --no-build -c Release --blame-hang-timeout 5m

      - name: Build release folder (unsigned)
        id: build
        shell: pwsh
        run: |
          ./scripts/Build-Release.ps1 -Stage Build
          $folder = (Get-ChildItem artifacts -Directory -Filter 'Kshatriya-*-win-x64' | Select-Object -First 1).FullName
          "folder=$folder" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned build for signing
        id: unsigned
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kshatriya-unsigned
          path: ${{ steps.build.outputs.folder }}
          retention-days: 3

      - name: Sign with SignPath (waits for manual approval)
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'kshatriya-antivirus' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }} # empty: the project's default
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Hosted jobs end after 6 hours, so the approver has 5 hours to approve the request in SignPath.
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: ${{ runner.temp }}/signed

      - name: Replace binaries with the signed ones
        if: env.SIGNPATH_CONFIGURED == 'true'
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signed'
          Get-ChildItem $signed -File | Where-Object { $_.Extension -in '.exe', '.dll' } |
            Copy-Item -Destination '${{ steps.build.outputs.folder }}' -Force

      - name: Package release
        shell: pwsh
        run: |
          if ($env:SIGNPATH_CONFIGURED -eq 'true') { ./scripts/Build-Release.ps1 -Stage Package -RequireSignature }
          else { Write-Host 'SignPath is not configured; the release will be UNSIGNED.'; ./scripts/Build-Release.ps1 -Stage Package }

      - uses: actions/upload-artifact@v4
        with:
          name: kshatriya-release
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256

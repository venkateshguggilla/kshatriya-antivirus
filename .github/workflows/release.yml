name: release

# Builds a release zip for a version tag (or on demand). Binaries are Authenticode-signed only when the
# repository secrets SIGNING_CERT_PFX_BASE64 and SIGNING_CERT_PASSWORD exist; otherwise the release is
# built and clearly marked UNSIGNED. The zip is uploaded as a workflow artifact, not published anywhere.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch YARA-X (hash-pinned)
        shell: pwsh
        run: ./scripts/Get-YaraX.ps1

      - name: Build and test (warnings are errors)
        run: |
          dotnet build Sentinel.slnx -c Release
          dotnet test Sentinel.slnx --no-build -c Release --blame-hang-timeout 5m

      - name: Prepare signing certificate (if configured)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          if ($env:PFX_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
            "SENTINEL_SIGN_PFX=$path" >> $env:GITHUB_ENV
          } else {
            Write-Host 'No signing certificate configured; the release will be UNSIGNED.'
          }

      - name: Build release
        shell: pwsh
        env:
          SENTINEL_SIGN_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./scripts/Build-Release.ps1

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'signing.pfx') -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-release
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
